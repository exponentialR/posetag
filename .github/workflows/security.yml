name: Security scan

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  merge_group:

permissions:
  actions: read
  contents: read
  security-events: write
  pull-requests: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          output: .codeql-results
          upload: never

      - name: Upload CodeQL SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: .codeql-results/*.sarif
          if-no-files-found: error

  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Build project dependency list
        run: |
          python -m venv .audit-venv
          . .audit-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install ".[apriltags,scipy]"
          python -m pip freeze \
            --exclude posetag \
            --exclude pip \
            --exclude setuptools \
            --exclude wheel \
            > audit-requirements.txt
          cat audit-requirements.txt

      - name: Audit project dependencies
        run: |
          python -m pip_audit -r audit-requirements.txt
