name: Workflow lint

on:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - "scripts/check-workflows.sh"
  push:
    branches: [develop]
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - "scripts/check-workflows.sh"
  merge_group:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@v1
